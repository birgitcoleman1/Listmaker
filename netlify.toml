[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "22"
[functions."workflow-runner"]
schedule = "*/5 * * * *"
# Separate public, Listmaker and CMS route trees share the SPA entry.
[[redirects]]
from = "/lm/*"
to = "/index.html"
status = 200
[[redirects]]
from = "/admin/*"
to = "/index.html"
status = 200
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
